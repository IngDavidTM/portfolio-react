name: CI

on:
  pull_request:
  push:
    branches: [dev]

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npx eslint "src/**/*.{js,jsx}"
      - name: Stylelint
        run: npx stylelint "src/**/*.css"
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
